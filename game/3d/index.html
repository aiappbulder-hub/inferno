<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PURGATORIO — the shore</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; touch-action: none; }
  #ui { position: fixed; inset: 0; pointer-events: none;
        font-family: Georgia, serif; color: #EFE3C0; }
  #card { position: absolute; top: 12%; width: 100%; text-align: center;
          opacity: 0; transition: opacity 2.5s; }
  #card h1 { font-weight: 600; letter-spacing: 0.55em; margin: 0;
             font-size: clamp(26px, 6vw, 54px); text-indent: 0.55em; }
  #card p  { color: #8A8578; font-style: italic; margin-top: 10px;
             font-size: clamp(12px, 2.2vw, 18px); }
  #sub { position: absolute; bottom: 7%; width: 100%; text-align: center; }
  #sub span { display: inline-block; background: rgba(0,0,0,0.5);
              color: #E8DCC0; font-style: italic; padding: 10px 18px;
              max-width: 72%; font-size: clamp(13px, 2.4vw, 19px);
              line-height: 1.5; }
  #end { position: absolute; inset: 0; display: flex; flex-direction: column;
         align-items: center; justify-content: center; gap: 14px;
         background: rgba(6,8,14,0); pointer-events: none;
         transition: background 3s; }
  #end.on { background: rgba(6,8,14,0.85); pointer-events: auto; }
  #end div { opacity: 0; transition: opacity 2s 1.2s; text-align: center; }
  #end.on div { opacity: 1; }
  #end a { color: #8A8578; font-size: 14px; text-decoration: none;
           border: 1px solid #3a382f; padding: 8px 18px; margin-top: 18px;
           display: inline-block; }
  #hint { position: absolute; top: 12px; right: 16px; color: #55524A;
          font: 12px system-ui, sans-serif; }
  /* touch controls — visible the moment a finger touches the screen */
  #stick, #jump { position: fixed; display: none; z-index: 5;
                  touch-action: none; }
  body.touch #stick, body.touch #jump { display: block; }
  #stick { left: 26px; bottom: 30px; width: 104px; height: 104px;
           border-radius: 50%; background: rgba(239,227,192,0.10);
           border: 1.5px solid rgba(239,227,192,0.3); }
  #nub { position: absolute; left: 32px; top: 32px; width: 40px; height: 40px;
         border-radius: 50%; background: rgba(239,227,192,0.45); }
  #jump { right: 30px; bottom: 42px; width: 82px; height: 82px;
          border-radius: 50%; background: rgba(239,227,192,0.12);
          border: 1.5px solid rgba(239,227,192,0.3); color: #EFE3C0;
          font: 26px/82px system-ui, sans-serif; text-align: center; }
  #jump.held { background: rgba(239,227,192,0.35); }
</style>
</head>
<body>
<div id="ui">
  <div id="card"><h1>PURGATORIO</h1><p>the shore of the mountain</p></div>
  <div id="sub" style="display:none"><span id="subtext"></span></div>
  <div id="end"><div>
    <h1 style="font-weight:600;letter-spacing:.4em;text-indent:.4em;font-size:clamp(22px,5vw,44px);margin:0">TO BE CONTINUED</h1>
    <p style="color:#8A8578;font-style:italic">the mountain waits</p>
    <a href="../">↺ descend again</a>
  </div></div>
  <div id="hint">WASD / arrows walk · shift run · space jump · drag to steer · v8</div>
</div>
<div id="stick"><div id="nub"></div></div>
<div id="jump">▲</div>
<!-- bundle.js is built from main.js (source of truth) with:
     npm i three esbuild
     npx esbuild main.js --bundle --minify --format=iife --outfile=bundle.js
     Bundled so the chapter also runs from file:// with no server.
     Optional: put a rigged GLB at models/dante.glb (clips named
     idle/walk/run) and it replaces the procedural mannequin. -->
<script src="bundle.js"></script>
</body>
</html>
